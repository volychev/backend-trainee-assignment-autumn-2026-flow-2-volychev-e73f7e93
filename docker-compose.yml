services:
  postgres:
    image: postgres:16-alpine
    container_name: avito_kitchen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kitchen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kitchen}
      POSTGRES_DB: ${POSTGRES_DB:-kitchen_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kitchen} -d ${POSTGRES_DB:-kitchen_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  main-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avito_kitchen_main_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kitchen}:${POSTGRES_PASSWORD:-kitchen}@postgres:5432/${POSTGRES_DB:-kitchen_db}
      MOCK_RESTAURANT_WEBHOOK_URL: http://mock-restaurant:8001/webhook/order
      APP_HOST: 0.0.0.0
      APP_PORT: 8000

  mock-restaurant:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: avito_kitchen_mock_restaurant
    restart: unless-stopped
    depends_on:
      - main-api
    ports:
      - "8001:8001"
    environment:
      MAIN_API_URL: http://main-api:8000
      MOCK_HOST: 0.0.0.0
      MOCK_PORT: 8001

volumes:
  postgres_data:
    name: avito_kitchen_postgres_data
